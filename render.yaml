# Render.com deployment configuration
version: 2
services:
  - name: voice-detection-api
    type: web
    runtime: docker
    plan: free
    envVars:
      - key: API_SECRET_KEY
        sync: false  # Set manually in Render dashboard
      - key: HF_TOKEN
        sync: false  # Required: HuggingFace token for Inference API
    scaling:
      minInstances: 1
      maxInstances: 1